[pytest]
# Los tests se buscan solo dentro de tests/ y las carpetas del proyecto
# (config, pages, utils...) se pueden importar desde cualquier lugar.
testpaths = tests
pythonpath = .

# -v: salida detallada
# --html: genera el reporte en reports/reporte.html (un solo archivo, sin CSS/JS sueltos)
addopts = -v --html=reports/reporte.html --self-contained-html

markers =
    ui: pruebas de interfaz con Selenium (SauceDemo)
    api: pruebas de API con Requests (JSONPlaceholder)

# Log de cada ejecución en reports/ejecucion.log (se sobreescribe en cada corrida)
log_file = reports/ejecucion.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
