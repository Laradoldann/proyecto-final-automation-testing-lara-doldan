name: Pruebas automatizadas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Chrome ya viene instalado en ubuntu-latest; Selenium Manager descarga el chromedriver
      - name: Ejecutar todas las pruebas (UI en modo headless + API)
        run: pytest --headless

      - name: Guardar reportes, log y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: reports/
          if-no-files-found: warn
